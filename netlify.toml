[build]
  command = "node build.mjs"
  publish = "dist"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"
  SITE_ENV = "preview"
[functions]
  included_files = ["content/procedures/*.json"]
# Production remains preview unless SITE_ENV=production and DEPLOY_TARGET=netlify
# are deliberately configured after choosing the final host and completing content.
# LEAD_WEBHOOK_URL and LEAD_CAPTURE_ENABLED are runtime secrets/settings in Netlify.
